# Social Beam - Production Nginx Configuration
# Reverse proxy + SSL termination + caching + compression

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ---------------------------------------------------------------------------
    # Performance
    # ---------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M; # Match Next.js bodySizeLimit for media uploads

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/opentype
        font/ttf
        font/woff
        font/woff2;

    # ---------------------------------------------------------------------------
    # Rate limiting zones
    # ---------------------------------------------------------------------------
    # General API rate limit: 60 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/s;
    # Stricter limit for auth endpoints: 10 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
    # AI endpoints: 5 req/s per IP (protect OpenAI credits)
    limit_req_zone $binary_remote_addr zone=api_ai:10m rate=5r/s;

    # ---------------------------------------------------------------------------
    # Upstream: Next.js app
    # ---------------------------------------------------------------------------
    upstream nextjs_app {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    # ---------------------------------------------------------------------------
    # HTTP -> HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt challenge path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ${DOMAIN:?REPLACE_WITH_YOUR_ACTUAL_DOMAIN}; # e.g. app.socialbeam.ai

        # SSL certificates (managed by certbot)
        ssl_certificate /etc/letsencrypt/live/${DOMAIN:?REPLACE_WITH_YOUR_ACTUAL_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN:?REPLACE_WITH_YOUR_ACTUAL_DOMAIN}/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # SSL hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security headers (belt + suspenders with proxy.ts)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---------------------------------------------------------------------------
        # Static assets - long cache
        # ---------------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://nextjs_app;
            proxy_cache_valid 200 60d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Public static files (favicon, robots.txt, images in /public)
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|webm|woff|woff2|ttf|eot)$ {
            proxy_pass http://nextjs_app;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # ---------------------------------------------------------------------------
        # AI endpoints - strict rate limit
        # ---------------------------------------------------------------------------
        location ~ ^/api/(brand-context/stream|compose/generate|ideas/generate|campaigns/.*/generate) {
            limit_req zone=api_ai burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for streaming endpoints
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 300s;
        }

        # ---------------------------------------------------------------------------
        # Auth endpoints - strict rate limit
        # ---------------------------------------------------------------------------
        location /api/auth/ {
            limit_req zone=api_auth burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------------
        # Other API routes - general rate limit
        # ---------------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general burst=40 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------------
        # WebSocket support (HMR in dev; Next.js live features)
        # ---------------------------------------------------------------------------
        location /_next/webpack-hmr {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ---------------------------------------------------------------------------
        # Default: proxy to Next.js
        # ---------------------------------------------------------------------------
        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
