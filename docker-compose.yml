services:
  postgres:
    image: postgres:17-alpine
    container_name: socialbeam-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: socialbeam
      POSTGRES_PASSWORD: socialbeam
      POSTGRES_DB: socialbeam
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
