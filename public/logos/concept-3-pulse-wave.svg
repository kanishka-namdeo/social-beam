  <rect x="5" y="18" width="4" height="8" rx="2" fill="#FF7759" opacity="0.4"/>
  <rect x="11" y="12" width="4" height="14" rx="2" fill="#FF7759" opacity="0.65"/>
  <rect x="17" y="6" width="4" height="20" rx="2" fill="#FF7759"/>
  <!-- Signal arc above -->
  <path d="M7 17C7 17 13 11 19 11C25 11 27 14 27 14" stroke="#FF7759" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
