<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Central dot with fading radiating beams — stronger on top/right, softer on bottom/left -->
  <circle cx="16" cy="16" r="5.5" fill="#FF7759"/>
  <!-- Top beam (strongest) -->
  <path d="M15.2 10.5C15.5 9 15.8 7 16 5.5C16.2 7 16.5 9 16.8 10.5Z" fill="#FF7759" opacity="0.9"/>
  <!-- Top-right beam -->
  <path d="M19.5 12.5C20.8 11.8 22.5 10.5 23.8 9.5C22.8 11 21.5 12.2 20.5 13.5Z" fill="#FF7759" opacity="0.8"/>
  <!-- Right beam -->
  <path d="M21.5 15.2C23 15.5 25 15.8 26.5 16C25 16.2 23 16.5 21.5 16.8Z" fill="#FF7759" opacity="0.7"/>
  <!-- Bottom-right beam -->
  <path d="M19.5 19.5C20.8 20.2 22.5 21.5 23.8 22.5C22.8 21 21.5 19.8 20.5 18.5Z" fill="#FF7759" opacity="0.5"/>
  <!-- Bottom beam (faintest) -->
  <path d="M15.2 21.5C15.5 23 15.8 25 16 26.5C16.2 25 16.5 23 16.8 21.5Z" fill="#FF7759" opacity="0.35"/>
  <!-- Bottom-left beam -->
  <path d="M12.5 19.5C11.2 20.2 9.5 21.5 8.2 22.5C9.2 21 10.5 19.8 11.5 18.5Z" fill="#FF7759" opacity="0.4"/>
  <!-- Left beam -->
  <path d="M10.5 15.2C9 15.5 7 15.8 5.5 16C7 16.2 9 16.5 10.5 16.8Z" fill="#FF7759" opacity="0.6"/>
  <!-- Top-left beam -->
  <path d="M12.5 12.5C11.2 11.8 9.5 10.5 8.2 9.5C9.2 11 10.5 12.2 11.5 13.5Z" fill="#FF7759" opacity="0.7"/>
</svg>
